# Defaults for image training.

ema: 0.99

img_channels: 3
model_channels: 256
num_res_blocks: 2
channel_mult: "1,2,4,8"
use_checkpoint: True
attention_resolutions: "8"
num_heads: 1
num_head_channels: -1
num_heads_upsample: -1
use_scale_shift_norm: False
dropout: 0.0
resblock_updown: False
use_fp16: False
use_new_attention_order: False

model_conditional_path: models/model_params_conditional.pth 
model_marginal_path: models/model_params_marginal.pth